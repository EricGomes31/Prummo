# Cópia de segurança diária do Prumo, guardada FORA do servidor, como artefato deste repositório privado.
# A VPS já faz a própria cópia às 02:30 (infra/vps/copia.sh, guarda 14 dias lá). Às 03:00 este job entra
# na VPS com uma chave que só consegue rodar "prumo-copia --enviar" (restrita no authorized_keys) e guarda
# o .tar.gz (banco em pg_dump + anexos) por 30 dias. Restaurar: ver o cabeçalho de infra/vps/copia.sh.
# Segredo: VPS_CHAVE_COPIA (Settings > Secrets and variables > Actions).
# Se falhar, o GitHub manda e-mail para quem alterou este arquivo por último.
name: Cópia diária do banco

on:
  schedule:
    - cron: '0 6 * * *' # 03:00 em Brasília
  workflow_dispatch: # e manualmente, pelo botão "Run workflow"

permissions:
  contents: read

jobs:
  copia:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Buscar a cópia na VPS
        env:
          CHAVE: ${{ secrets.VPS_CHAVE_COPIA }}
        run: |
          test -n "$CHAVE" || { echo "Falta o segredo VPS_CHAVE_COPIA."; exit 1; }
          install -m 700 -d ~/.ssh
          # Colada pelo navegador, a chave pode vir com quebras de linha do Windows (\r), que o ssh recusa.
          printf '%s\n' "$CHAVE" | tr -d '\r' > ~/.ssh/copia && chmod 600 ~/.ssh/copia
          ssh-keygen -y -f ~/.ssh/copia > /dev/null || { echo "O segredo VPS_CHAVE_COPIA não é uma chave válida: cole de novo o arquivo inteiro."; exit 1; }
          ssh-keygen -lf ~/.ssh/copia
          # Identidade do servidor fixada: recusa outro servidor no mesmo endereço.
          echo '179.236.68.14 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAbe5Lc+6DJOXExYvjNKLVSgKiPNXY6B/Td5X2X2SOR8' > ~/.ssh/known_hosts
          NOME=$(TZ=America/Sao_Paulo date +%Y-%m-%d-%H%M)
          mkdir copia
          ssh -i ~/.ssh/copia -o BatchMode=yes root@179.236.68.14 > "copia/prumo-$NOME.tar.gz"
          tar -tzf "copia/prumo-$NOME.tar.gz" | grep -q banco.dump || { echo "A cópia veio vazia ou incompleta."; exit 1; }
          ls -l copia
          echo "NOME=$NOME" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: prumo-${{ env.NOME }}
          path: copia
          retention-days: 30
          if-no-files-found: error
          compression-level: 0
